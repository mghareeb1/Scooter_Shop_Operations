<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متباعه العمليات اليوميه - Scooter Shop Company</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0b0b0e;
            --bg-card: #15151c;
            --bg-card-hover: #1c1c26;
            --accent-orange: #FF6A00;
            --accent-orange-hover: #e05d00;
            --accent-gold: #FFB800;
            --text-main: #FFFFFF;
            --text-muted: #9494a0;
            --border-color: #272733;
            
            --status-new-border: #FF3B30;
            --status-new-bg: rgba(255, 59, 48, 0.12);
            --status-progress-border: #FF9500;
            --status-progress-bg: rgba(255, 149, 0, 0.12);
            --status-solved-border: #34C759;
            --status-solved-bg: rgba(52, 199, 89, 0.12);
            
            --radius-lg: 14px;
            --radius-md: 8px;
            --shadow-card: 0 6px 20px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 50% 5%, rgba(255, 106, 0, 0.08) 0%, transparent 55%),
                linear-gradient(45deg, #111116 25%, transparent 25%), 
                linear-gradient(-45deg, #111116 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #111116 75%), 
                linear-gradient(-45deg, transparent 75%, #111116 75%);
            background-size: 100% 100%, 14px 14px, 14px 14px, 14px 14px, 14px 14px;
            background-position: 0 0, 0 0, 7px 0, 7px -7px, 0px 7px;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 14px 60px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 22px;
            width: 100%;
        }

        .logo-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--accent-orange);
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.4);
            overflow: hidden;
            padding: 6px;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-size: 0.84rem;
            color: var(--accent-orange);
            font-weight: 700;
            margin-top: 3px;
        }

        .metrics-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }

        .metric-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .val-new { color: #FF3B30; }
        .val-progress { color: #FF9500; }
        .val-archive { color: #34C759; }
        .val-all { color: var(--accent-orange); }

        .action-bar {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-main {
            background: var(--accent-orange);
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-main:hover {
            background: var(--accent-orange-hover);
        }

        .btn-outline {
            background: rgba(255, 106, 0, 0.08);
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 9px 16px;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-outline:hover, .btn-outline.active {
            background: var(--accent-orange);
            color: #fff;
        }

        .controls-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: var(--shadow-card);
        }

        .search-box {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            background: #101016;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 38px 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-orange);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            color: var(--accent-orange);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .select-filter {
            flex: 1;
            min-width: 140px;
            background: #101016;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: #e0e0e0;
            padding: 8px 10px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        .tickets-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ticket-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--shadow-card);
            transition: background 0.15s ease;
            position: relative;
        }

        .ticket-card:hover {
            background: var(--bg-card-hover);
        }

        .ticket-card.status-new { border-right: 5px solid var(--status-new-border); }
        .ticket-card.status-progress { border-right: 5px solid var(--status-progress-border); }
        .ticket-card.status-solved, .ticket-card.status-closed { border-right: 5px solid var(--status-solved-border); }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #242430;
            padding-bottom: 8px;
        }

        .ticket-id {
            font-size: 0.88rem;
            font-weight: 900;
            color: var(--accent-orange);
        }

        .ticket-badges {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .badge-branch { background: #242432; color: #d1d1db; }
        .badge-category { background: rgba(255, 184, 0, 0.12); color: var(--accent-gold); border: 1px solid rgba(255, 184, 0, 0.3); }
        .badge-status-new { background: var(--status-new-bg); color: var(--status-new-border); border: 1px solid var(--status-new-border); }
        .badge-status-progress { background: var(--status-progress-bg); color: var(--status-progress-border); border: 1px solid var(--status-progress-border); }
        .badge-status-solved { background: var(--status-solved-bg); color: var(--status-solved-border); border: 1px solid var(--status-solved-border); }

        .ticket-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .client-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .client-name {
            font-size: 0.95rem;
            font-weight: 800;
            color: #fff;
        }

        .contact-actions {
            display: flex;
            gap: 6px;
        }

        .btn-call, .btn-wa {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            text-decoration: none;
        }

        .btn-call { background: #2979FF; color: #fff; }
        .btn-wa { background: #25D366; color: #fff; }

        .scooter-meta {
            font-size: 0.76rem;
            color: var(--text-muted);
        }

        .issue-text {
            font-size: 0.86rem;
            color: #e4e4ec;
            line-height: 1.45;
            background: #111117;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            border-left: 2px solid #2e2e3e;
            margin-top: 4px;
        }

        .updates-timeline-box {
            background: #0d0d12;
            border: 1px solid #1e1e28;
            border-radius: var(--radius-md);
            padding: 8px 10px;
            font-size: 0.74rem;
            color: #a8a8b8;
            line-height: 1.5;
            white-space: pre-wrap;
            max-height: 90px;
            overflow-y: auto;
        }

        .timeline-header {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent-orange);
            margin-bottom: 2px;
        }

        .ticket-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px dashed #242430;
            padding-top: 8px;
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .card-btn-group {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            background: #20202c;
            color: #fff;
            border: 1px solid #363648;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sm:hover {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
        }

        .btn-delete:hover {
            background: #ff3b30;
            border-color: #ff3b30;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1.5px solid var(--accent-orange);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 520px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-orange);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 0.76rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .form-input, .form-textarea, .form-select {
            background: #101016;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 8px 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: var(--accent-orange);
        }

        .form-textarea {
            resize: vertical;
            min-height: 70px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--accent-orange);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .empty-box {
            text-align: center;
            padding: 50px 10px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر واللوجو المباشر logo.png -->
        <header>
            <div class="logo-wrapper">
                <img src="logo.png" alt="Scooter Shop Company" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2972/2972185.png'">
            </div>
            <h1 class="brand-title">SCOOTER SHOP COMPANY</h1>
            <p class="brand-subtitle">متابعه العمليات اليوميه</p>
        </header>

        <!-- الإحصائيات -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">حالات جديدة (عاجلة)</div>
                <div id="countNew" class="metric-value val-new">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">قيد المتابعة</div>
                <div id="countProgress" class="metric-value val-progress">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">سجل الأرشيف (تم الحل)</div>
                <div id="countSolved" class="metric-value val-archive">0</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">إجمالي البلاغات</div>
                <div id="countTotal" class="metric-value val-all">0</div>
            </div>
        </div>

        <!-- شريط الإجراءات -->
        <div class="action-bar">
            <button class="btn-main" onclick="openCreateModal()">
                فتح تذكرة استثنائية جديدة +
            </button>
            <button id="archiveToggleBtn" class="btn-outline" onclick="toggleArchiveView()">
                عرض الأرشيف (الحالات المنتهية)
            </button>
        </div>

        <!-- أدوات البحث والتصفية -->
        <div class="controls-card">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم العميل، رقم الهاتف، رقم الشاسيه، أو رقم التذكرة..." oninput="filterTickets()">
            </div>
            <div class="filter-row">
                <select id="branchFilter" class="select-filter" onchange="filterTickets()">
                    <option value="">جميع الفروع (بما فيها التوكيل)</option>
                    <option value="التوكيل">فرع التوكيل</option>
                    <option value="مدينة نصر">مدينة نصر</option>
                    <option value="العاشر من رمضان">العاشر من رمضان</option>
                    <option value="الزقازيق">الزقازيق</option>
                    <option value="المنصورة">المنصورة</option>
                    <option value="بلقاس">بلقاس</option>
                    <option value="دمياط الجديدة">دمياط الجديدة</option>
                </select>

                <select id="categoryFilter" class="select-filter" onchange="filterTickets()">
                    <option value="">جميع الأقسام</option>
                    <option value="صيانة متعطلة">صيانة متعطلة ومعقدة</option>
                    <option value="قطع غيار حرجة">قطع غيار حرجة ونواقص</option>
                    <option value="شكاوى عملاء">شكاوى وتصعيد عملاء</option>
                    <option value="أوراق وترخيص">تأخير أوراق وترخيص</option>
                </select>

                <select id="priorityFilter" class="select-filter" onchange="filterTickets()">
                    <option value="">جميع الأولويات</option>
                    <option value="عاجل جداً">عاجل جداً 🔴</option>
                    <option value="متوسط">متوسط 🟡</option>
                    <option value="عادي">عادي</option>
                </select>
            </div>
        </div>

        <!-- قائمة التذاكر -->
        <div id="ticketsContainer" class="tickets-container">
            <div class="loading-spinner">جاري جلب بيانات التذاكر والعمليات...</div>
        </div>

        <div id="emptyBox" class="empty-box" style="display:none">
            <p>لا توجد أي تذاكر مطابقة حالياً.</p>
        </div>
    </div>

    <!-- نافذة: إنشاء تذكرة جديدة -->
    <div id="createModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">
                <span>فتح تذكرة استثنائية جديدة</span>
                <button class="modal-close" onclick="closeCreateModal()">✕</button>
            </div>
            
            <form id="createTicketForm" onsubmit="handleCreateTicket(event)">
                <div class="form-group">
                    <label class="form-label">الفرع *</label>
                    <select id="newBranch" class="form-select" required>
                        <option value="التوكيل">فرع التوكيل</option>
                        <option value="مدينة نصر">مدينة نصر</option>
                        <option value="العاشر من رمضان">العاشر من رمضان</option>
                        <option value="الزقازيق">الزقازيق</option>
                        <option value="المنصورة">المنصورة</option>
                        <option value="بلقاس">بلقاس</option>
                        <option value="دمياط الجديدة">دمياط الجديدة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">نوع المشكلة / القسم *</label>
                    <select id="newCategory" class="form-select" required>
                        <option value="صيانة متعطلة">صيانة متعطلة ومعقدة</option>
                        <option value="قطع غيار حرجة">قطع غيار حرجة ونواقص</option>
                        <option value="شكاوى عملاء">شكاوى وتصعيد عملاء</option>
                        <option value="أوراق وترخيص">تأخير أوراق وترخيص</option>
                    </select>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div class="form-group">
                        <label class="form-label">اسم العميل *</label>
                        <input type="text" id="newClientName" class="form-input" placeholder="اسم العميل" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">رقم الهاتف (اختياري)</label>
                        <input type="tel" id="newClientPhone" class="form-input" placeholder="01xxxxxxxxx">
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div class="form-group">
                        <label class="form-label">موديل السكوتر *</label>
                        <input type="text" id="newScooterModel" class="form-input" placeholder="مثل: Jet 14, Fiddle 3" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">رقم الشاسيه / اللوحة</label>
                        <input type="text" id="newChassisNo" class="form-input" placeholder="اختياري">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">تفاصيل المشكلة ونقطة التعطيل *</label>
                    <textarea id="newIssue" class="form-textarea" placeholder="اشرح تفاصيل المشكلة وما المطلوب للحل..." required></textarea>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div class="form-group">
                        <label class="form-label">درجة الأولوية</label>
                        <select id="newPriority" class="form-select">
                            <option value="عاجل جداً">عاجل جداً 🔴</option>
                            <option value="متوسط" selected>متوسط 🟡</option>
                            <option value="عادي">عادي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">المسؤول المكلف بالمتابعة</label>
                        <input type="text" id="newAssignee" class="form-input" placeholder="اسم الشخص المسؤول">
                    </div>
                </div>

                <button type="submit" id="btnSubmitCreate" class="btn-main" style="width:100%; justify-content:center; margin-top:10px;">
                    تسجيل التذكرة فوراً
                </button>
            </form>
        </div>
    </div>

    <!-- نافذة: تحديث الحالة وإضافة ملاحظة متابعة -->
    <div id="updateModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">
                <span id="updateModalTicketId">تحديث التذكرة</span>
                <button class="modal-close" onclick="closeUpdateModal()">✕</button>
            </div>
            
            <form id="updateTicketForm" onsubmit="handleUpdateStatus(event)">
                <input type="hidden" id="updateTargetId">
                
                <div class="form-group">
                    <label class="form-label">تعديل الحالة إلى *</label>
                    <select id="updateStatusSelect" class="form-select" required>
                        <option value="قيد المتابعة">قيد المتابعة 🟡</option>
                        <option value="تم الحل">تم الحل (نقل للأرشيف) 🟢</option>
                        <option value="مغلقة">مغلقة نهائياً (نقل للأرشيف) 🟢</option>
                        <option value="جديدة">جديدة 🔴</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">إضافة ملاحظة / إجراء جديد</label>
                    <textarea id="updateNoteText" class="form-textarea" placeholder="اكتب ما تم تنفيذه..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">سجل المتابعات المسجل في الشيت:</label>
                    <div id="existingNotesLog" style="font-size:0.75rem; color:#a1a1b0; background:#101016; padding:8px; border-radius:6px; max-height:120px; overflow-y:auto; white-space:pre-wrap;"></div>
                </div>

                <button type="submit" id="btnSubmitUpdate" class="btn-main" style="width:100%; justify-content:center; margin-top:10px;">
                    حفظ التحديث
                </button>
            </form>
        </div>
    </div>

    <!-- نافذة: تعديل بيانات التذكرة بالكامل (Edit Full Ticket) -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">
                <span id="editModalTitle">تعديل بيانات التذكرة</span>
                <button class="modal-close" onclick="closeEditModal()">✕</button>
            </div>
            
            <form id="editTicketForm" onsubmit="handleEditTicket(event)">
                <input type="hidden" id="editTargetId">

                <div class="form-group">
                    <label class="form-label">الفرع *</label>
                    <select id="editBranch" class="form-select" required>
                        <option value="التوكيل">فرع التوكيل</option>
                        <option value="مدينة نصر">مدينة نصر</option>
                        <option value="العاشر من رمضان">العاشر من رمضان</option>
                        <option value="الزقازيق">الزقازيق</option>
                        <option value="المنصورة">المنصورة</option>
                        <option value="بلقاس">بلقاس</option>
                        <option value="دمياط الجديدة">دمياط الجديدة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">نوع المشكلة / القسم *</label>
                    <select id="editCategory" class="form-select" required>
                        <option value="صيانة متعطلة">صيانة متعطلة ومعقدة</option>
                        <option value="قطع غيار حرجة">قطع غيار حرجة ونواقص</option>
                        <option value="شكاوى عملاء">شكاوى وتصعيد عملاء</option>
                        <option value="أوراق وترخيص">تأخير أوراق وترخيص</option>
                    </select>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div class="form-group">
                        <label class="form-label">اسم العميل *</label>
                        <input type="text" id="editClientName" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">رقم الهاتف (اختياري)</label>
                        <input type="tel" id="editClientPhone" class="form-input">
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div class="form-group">
                        <label class="form-label">موديل السكوتر *</label>
                        <input type="text" id="editScooterModel" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">رقم الشاسيه / اللوحة</label>
                        <input type="text" id="editChassisNo" class="form-input">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">تفاصيل المشكلة *</label>
                    <textarea id="editIssue" class="form-textarea" required></textarea>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                    <div class="form-group">
                        <label class="form-label">درجة الأولوية</label>
                        <select id="editPriority" class="form-select">
                            <option value="عاجل جداً">عاجل جداً 🔴</option>
                            <option value="متوسط">متوسط 🟡</option>
                            <option value="عادي">عادي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">المسؤول المكلف</label>
                        <input type="text" id="editAssignee" class="form-input">
                    </div>
                </div>

                <button type="submit" id="btnSubmitEdit" class="btn-main" style="width:100%; justify-content:center; margin-top:10px;">
                    حفظ التعديلات
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyj3FfYxGO-NmXi3ikfOjNjGuRboqJW1LuQ987571hgXzbYE8U1bPhOhv3omAXos2-58g/exec";

        let ALL_TICKETS = [];
        let IS_ARCHIVE_VIEW = false;

        async function fetchTickets() {
            const container = document.getElementById('ticketsContainer');
            try {
                const res = await fetch(`${API_URL}?action=getTickets`);
                const data = await res.json();

                if (data.success) {
                    ALL_TICKETS = data.tickets || [];
                    updateMetrics();
                    filterTickets();
                } else {
                    container.innerHTML = `<div style="color:#ff3b30; text-align:center;">خطأ: ${data.message || 'تعذر تحميل البيانات'}</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div style="color:#ff3b30; text-align:center;">فشل الاتصال بالشيت. تأكد من إعدادات النشر لـ Apps Script.</div>`;
            }
        }

        function updateMetrics() {
            let countNew = 0;
            let countProgress = 0;
            let countSolved = 0;

            ALL_TICKETS.forEach(t => {
                if (t.status === 'جديدة') countNew++;
                else if (t.status === 'قيد المتابعة') countProgress++;
                else if (t.status === 'تم الحل' || t.status === 'مغلقة') countSolved++;
            });

            document.getElementById('countNew').textContent = countNew;
            document.getElementById('countProgress').textContent = countProgress;
            document.getElementById('countSolved').textContent = countSolved;
            document.getElementById('countTotal').textContent = ALL_TICKETS.length;
        }

        function filterTickets() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const branch = document.getElementById('branchFilter').value;
            const category = document.getElementById('categoryFilter').value;
            const priority = document.getElementById('priorityFilter').value;

            const filtered = ALL_TICKETS.filter(t => {
                const isSolved = (t.status === 'تم الحل' || t.status === 'مغلقة');
                if (IS_ARCHIVE_VIEW && !isSolved) return false;
                if (!IS_ARCHIVE_VIEW && isSolved) return false;

                if (branch && t.branch !== branch) return false;
                if (category && t.category !== category) return false;
                if (priority && t.priority !== priority) return false;

                if (search) {
                    const match = (t.clientName && t.clientName.toLowerCase().includes(search)) ||
                                  (t.clientPhone && t.clientPhone.includes(search)) ||
                                  (t.chassisNo && t.chassisNo.toLowerCase().includes(search)) ||
                                  (t.id && t.id.toLowerCase().includes(search)) ||
                                  (t.issue && t.issue.toLowerCase().includes(search));
                    if (!match) return false;
                }

                return true;
            });

            renderTickets(filtered);
        }

        <!-- نافذة منبثقة: عرض السجل الكامل للتحديثات -->
<div id="historyModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-title">
            <span id="historyModalTitle">سجل التحديثات الكامل</span>
            <button class="modal-close" onclick="closeHistoryModal()">✕</button>
        </div>
        <div id="historyContent" style="font-size:0.82rem; color:#e0e0ec; background:#101016; padding:12px; border-radius:8px; max-height:300px; overflow-y:auto; line-height:1.6; white-space:pre-wrap; border:1px solid #272733;">
        </div>
        <button type="button" class="btn-outline" style="width:100%; justify-content:center; margin-top:8px;" onclick="closeHistoryModal()">
            إغلاق
        </button>
    </div>
</div>

        function toggleArchiveView() {
            IS_ARCHIVE_VIEW = !IS_ARCHIVE_VIEW;
            const btn = document.getElementById('archiveToggleBtn');
            if (IS_ARCHIVE_VIEW) {
                btn.classList.add('active');
                btn.innerHTML = `عرض الحالات النشطة المفتوحة 📋`;
            } else {
                btn.classList.remove('active');
                btn.innerHTML = `عرض الأرشيف (الحالات المنتهية)`;
            }
            filterTickets();
        }

        function openCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        async function handleCreateTicket(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('btnSubmitCreate');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الحفظ في الشيت...';

            const payload = {
                action: 'createTicket',
                branch: document.getElementById('newBranch').value,
                category: document.getElementById('newCategory').value,
                clientName: document.getElementById('newClientName').value.trim(),
                clientPhone: document.getElementById('newClientPhone').value.trim(),
                scooterModel: document.getElementById('newScooterModel').value.trim(),
                chassisNo: document.getElementById('newChassisNo').value.trim(),
                issue: document.getElementById('newIssue').value.trim(),
                priority: document.getElementById('newPriority').value,
                assignee: document.getElementById('newAssignee').value.trim()
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    alert('تم إنشاء التذكرة بنجاح برقم: ' + data.id);
                    document.getElementById('createTicketForm').reset();
                    closeCreateModal();
                    fetchTickets();
                } else {
                    alert('حدث خطأ: ' + data.message);
                }
            } catch (err) {
                alert('فشل في إرسال البيانات إلى السيرفر.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل التذكرة فوراً';
            }
        }

        /* نافذة تحديث الحالة وإضافة ملاحظة */
        function openUpdateModal(ticketId) {
            const t = ALL_TICKETS.find(item => item.id === ticketId);
            if (!t) return;

            document.getElementById('updateTargetId').value = t.id;
            document.getElementById('updateModalTicketId').textContent = `تحديث التذكرة (${t.id}) - ${t.clientName}`;
            document.getElementById('updateStatusSelect').value = t.status;
            document.getElementById('updateNoteText').value = '';
            document.getElementById('existingNotesLog').textContent = t.notes || 'لا توجد ملاحظات سابقة مدونة.';

            document.getElementById('updateModal').classList.add('active');
        }

        function closeUpdateModal() {
            document.getElementById('updateModal').classList.remove('active');
        }

        async function handleUpdateStatus(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('btnSubmitUpdate');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري التحديث...';

            const payload = {
                action: 'updateStatus',
                id: document.getElementById('updateTargetId').value,
                status: document.getElementById('updateStatusSelect').value,
                note: document.getElementById('updateNoteText').value.trim()
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    closeUpdateModal();
                    fetchTickets();
                } else {
                    alert('خطأ: ' + data.message);
                }
            } catch (err) {
                alert('فشل تحديث البيانات.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'حفظ التحديث';
            }
        }

        /* نافذة تعديل بيانات التذكرة */
        function openEditModal(ticketId) {
            const t = ALL_TICKETS.find(item => item.id === ticketId);
            if (!t) return;

            document.getElementById('editTargetId').value = t.id;
            document.getElementById('editModalTitle').textContent = `تعديل بيانات التذكرة (${t.id})`;
            document.getElementById('editBranch').value = t.branch;
            document.getElementById('editCategory').value = t.category;
            document.getElementById('editClientName').value = t.clientName;
            document.getElementById('editClientPhone').value = (t.clientPhone === '-' ? '' : t.clientPhone);
            document.getElementById('editScooterModel').value = t.scooterModel;
            document.getElementById('editChassisNo').value = (t.chassisNo === '-' ? '' : t.chassisNo);
            document.getElementById('editIssue').value = t.issue;
            document.getElementById('editPriority').value = t.priority;
            document.getElementById('editAssignee').value = (t.assignee === 'غير محدد' ? '' : t.assignee);

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function handleEditTicket(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('btnSubmitEdit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري حفظ التعديل...';

            const payload = {
                action: 'editTicket',
                id: document.getElementById('editTargetId').value,
                branch: document.getElementById('editBranch').value,
                category: document.getElementById('editCategory').value,
                clientName: document.getElementById('editClientName').value.trim(),
                clientPhone: document.getElementById('editClientPhone').value.trim(),
                scooterModel: document.getElementById('editScooterModel').value.trim(),
                chassisNo: document.getElementById('editChassisNo').value.trim(),
                issue: document.getElementById('editIssue').value.trim(),
                priority: document.getElementById('editPriority').value,
                assignee: document.getElementById('editAssignee').value.trim()
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    closeEditModal();
                    fetchTickets();
                } else {
                    alert('خطأ: ' + data.message);
                }
            } catch (err) {
                alert('فشل حفظ التعديلات.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'حفظ التعديلات';
            }
        }

        /* حذف التذكرة */
        async function handleDeleteTicket(ticketId) {
            if (!confirm(`هل أنت متأكد من رغبتك في حذف التذكرة (${ticketId}) نهائياً من الشيت؟`)) {
                return;
            }

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'deleteTicket', id: ticketId })
                });
                const data = await res.json();

                if (data.success) {
                    fetchTickets();
                } else {
                    alert('خطأ أثناء الحذف: ' + data.message);
                }
            } catch (err) {
                alert('فشل الاتصال بالسيرفر لحذف التذكرة.');
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        document.addEventListener('DOMContentLoaded', fetchTickets);
    </script>
</body>
</html>
